<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f14" />
  <title>Tilt Harp — OMO</title>
  <link rel="stylesheet" href="../../shared/ui.css" />
</head>
<body class="app-shell">
  <header class="app-header">
    <a class="back-link" href="../../">←</a>
    <h1>Tilt Harp</h1>
    <button type="button" class="learn-toggle" id="learnBtn">Learn</button>
  </header>
  <div class="learn-panel panel" id="learnPanel">
    <h2>Plucked gliss</h2>
    <p><strong>Tap</strong> strings. <strong>Tilt</strong> picks scale (pentatonic / major / minor).</p>
  </div>
  <div class="control-row">
    <label for="scale">Scale</label>
    <select id="scale">
      <option value="pent">Pentatonic</option>
      <option value="maj">Major</option>
      <option value="min">Minor</option>
    </select>
    <span id="keyOut">C</span>
  </div>
  <div class="main-stage">
    <div id="strings" class="harp-strings"></div>
  </div>
  <script type="module">
    import { bindLearn, startAudio } from "../../shared/app.js";
    import { createMasterBus, midiToFreq } from "../../shared/audio.js";
    import { enableSensors, onOrientation } from "../../shared/sensors.js";

    bindLearn();
    const SCALES = {
      pent: [0, 2, 4, 7, 9],
      maj: [0, 2, 4, 5, 7, 9, 11],
      min: [0, 2, 3, 5, 7, 8, 10],
    };
    const ROOTS = ["C", "D", "E", "F", "G", "A", "B"];
    let ctx, master, built = false;
    let rootMidi = 60;

    function buildAudio(c) {
      ctx = c;
      ({ master } = createMasterBus(c, 0.5));
      built = true;
      void enableSensors().then((ok) => {
        if (ok) {
          onOrientation((o) => {
            const t = ((o.gamma ?? 0) + 90) / 180;
            rootMidi = 48 + Math.floor(t * 14);
            document.getElementById("keyOut").textContent = ROOTS[rootMidi % 12];
          });
        }
      });
    }

    function pluck(midi) {
      const t = ctx.currentTime;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "triangle";
      o.frequency.value = midiToFreq(midi);
      g.gain.setValueAtTime(0.35, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
      o.connect(g);
      g.connect(master);
      o.start(t);
      o.stop(t + 0.65);
    }

    const strings = document.getElementById("strings");
    for (let i = 0; i < 8; i++) {
      const s = document.createElement("button");
      s.type = "button";
      s.className = "harp-string";
      s.style.left = `${(i / 7) * 100}%`;
      s.addEventListener("pointerdown", async (e) => {
        e.preventDefault();
        await startAudio(!built ? buildAudio : undefined);
        const scale = SCALES[document.getElementById("scale").value];
        pluck(rootMidi + scale[i % scale.length] + Math.floor(i / scale.length) * 12);
        s.classList.add("active");
      });
      s.addEventListener("pointerup", () => s.classList.remove("active"));
      strings.appendChild(s);
    }
  </script>
  <style>
    .harp-strings { position: relative; width: 100%; height: 100%; background: #0f172a; }
    .harp-string {
      position: absolute;
      top: 8%;
      bottom: 8%;
      width: 28px;
      margin-left: -14px;
      background: linear-gradient(180deg, transparent, rgba(110,231,183,0.35), transparent);
      border: none;
      border-radius: 4px;
    }
    .harp-string.active { background: rgba(110,231,183,0.55); }
  </style>
</body>
</html>
