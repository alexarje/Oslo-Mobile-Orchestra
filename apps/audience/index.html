<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f14" />
  <title>Audience Swell — OMO</title>
  <link rel="stylesheet" href="../../shared/ui.css" />
  <style>
    #swellBtn {
      width: min(85vw, 280px);
      height: min(85vw, 280px);
      border-radius: 50%;
      font-size: 1.1rem;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1rem;
      touch-action: none;
    }
    .audience-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1e293b 0%, #0d0f14 70%);
    }
  </style>
</head>
<body class="app-shell">
  <header class="app-header">
    <a class="back-link" href="../../">←</a>
    <h1>Audience</h1>
  </header>
  <div class="learn-panel panel" id="learnPanel">
    <h2>Audience swell</h2>
    <p>Turn <strong>Audio on</strong>, then <strong>hold</strong> the big button — you can move your finger inside the circle. Release to fade out.</p>
  </div>
  <div class="audience-stage">
    <button type="button" class="btn" id="swellBtn">Hold<br />to swell</button>
  </div>
  <script type="module">
    import { bindLearn, startAudio } from "../../shared/app.js";

    bindLearn();
    import { createMasterBus } from "../../shared/audio.js";

    const SWELL_LEVEL = 0.62;

    let ctx, master, osc, swellGain, built = false;
    let holding = false;
    let activePointer = null;

    function build(c) {
      ctx = c;
      ({ master } = createMasterBus(c, 0.62));
      osc = ctx.createOscillator();
      osc.type = "sine";
      osc.frequency.value = 220;

      const toneGain = ctx.createGain();
      toneGain.gain.value = 1;
      const toneOffset = ctx.createConstantSource();
      toneOffset.offset.value = 1;
      toneOffset.connect(toneGain.gain);

      const pitchLfo = ctx.createOscillator();
      pitchLfo.type = "sine";
      pitchLfo.frequency.value = 0.12 + Math.random() * 0.1;
      const pitchDepth = ctx.createGain();
      pitchDepth.gain.value = 5 + Math.random() * 4;
      pitchLfo.connect(pitchDepth);
      pitchDepth.connect(osc.detune);

      const ampLfo = ctx.createOscillator();
      ampLfo.type = "sine";
      ampLfo.frequency.value = 0.2 + Math.random() * 0.15;
      const ampDepth = ctx.createGain();
      ampDepth.gain.value = 0.05;
      ampLfo.connect(ampDepth);
      ampDepth.connect(toneGain.gain);

      swellGain = ctx.createGain();
      swellGain.gain.value = 0;
      osc.connect(toneGain);
      toneGain.connect(swellGain);
      swellGain.connect(master);

      toneOffset.start();
      pitchLfo.start();
      ampLfo.start();
      osc.start();
      built = true;
    }

    function pointerInsideBtn(e) {
      const r = btn.getBoundingClientRect();
      return (
        e.clientX >= r.left &&
        e.clientX <= r.right &&
        e.clientY >= r.top &&
        e.clientY <= r.bottom
      );
    }

    function swellOn() {
      if (!built || !ctx) return;
      const t = ctx.currentTime;
      swellGain.gain.cancelScheduledValues(t);
      swellGain.gain.setTargetAtTime(SWELL_LEVEL, t, 0.15);
      osc.frequency.cancelScheduledValues(t);
      osc.frequency.setTargetAtTime(180 + Math.random() * 80, t, 0.2);
    }

    function swellOff() {
      if (!built || !ctx) return;
      const t = ctx.currentTime;
      swellGain.gain.cancelScheduledValues(t);
      swellGain.gain.setTargetAtTime(0, t, 0.2);
    }

    function startHold(e) {
      holding = true;
      activePointer = e.pointerId;
      btn.classList.add("active");
      try {
        btn.setPointerCapture(e.pointerId);
      } catch {
        /* noop */
      }
      swellOn();
    }

    function endHold(e) {
      if (activePointer != null && e.pointerId !== activePointer) return;
      holding = false;
      activePointer = null;
      btn.classList.remove("active");
      swellOff();
    }

    const btn = document.getElementById("swellBtn");

    btn.addEventListener("pointerdown", async (e) => {
      e.preventDefault();
      await startAudio(!built ? build : undefined);
      startHold(e);
    });

    btn.addEventListener("pointermove", (e) => {
      if (!holding || e.pointerId !== activePointer) return;
      e.preventDefault();
      if (pointerInsideBtn(e)) {
        swellOn();
      }
    });

    btn.addEventListener("pointerup", (e) => {
      e.preventDefault();
      if (btn.hasPointerCapture(e.pointerId)) {
        try {
          btn.releasePointerCapture(e.pointerId);
        } catch {
          /* noop */
        }
      }
      endHold(e);
    });

    btn.addEventListener("lostpointercapture", (e) => {
      if (holding && e.pointerId === activePointer) endHold(e);
    });
  </script>
</body>
</html>
