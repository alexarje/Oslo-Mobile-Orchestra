<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f14" />
  <title>Pentatonic Flute — OMO</title>
  <link rel="stylesheet" href="../../shared/ui.css" />
</head>
<body class="app-shell">
  <header class="app-header">
    <a class="back-link" href="../../">←</a>
    <h1>Pentatonic Flute</h1>
  </header>
  <div class="learn-panel panel" id="learnPanel">
    <h2>Breath + finger holes</h2>
    <p>Turn <strong>Audio on</strong>, allow the mic, then <strong>blow</strong> past the yellow line.</p>
    <p><strong>Tap a hole</strong> to cover or uncover it. Lift fingers from the <strong>bottom</strong> hole upward for higher notes (C → D → E → G → A → C). Top = near mouthpiece.</p>
  </div>
  <p class="status-bar" id="status"></p>
  <div class="breath-row">
    <label>Breath</label>
    <div class="breath-meter breath-threshold" id="breathWrap" style="--thresh: 35%">
      <div class="breath-meter-fill" id="breathMeter"></div>
    </div>
  </div>
  <div class="main-stage">
    <div id="fluteBody" class="stage-fill flute-body">
      <span class="pad-readout" id="readout">C4</span>
      <div class="flute-tube" id="fluteTube" aria-label="Finger holes"></div>
    </div>
  </div>
  <script type="module">
    import { bindLearn, setStatus, startAudio, registerAudioBoot } from "../../shared/app.js";
    import { createMasterBus, midiToFreq, connectMicAnalyser, getMicStream, primeMicStream } from "../../shared/audio.js";

    bindLearn();
    const PENTA = [0, 2, 4, 7, 9];
    const ROOT_MIDI = 60;
    const NOTE_NAMES = ["C", "D", "E", "G", "A"];
    const HOLE_COUNT = 5;
    /** Open holes count (0–5) → pentatonic step index (0–9). */
    const OPEN_TO_INDEX = [0, 2, 4, 6, 8, 9];

    const fluteTube = document.getElementById("fluteTube");
    let ctx, master, analyser, micStream;
    let toneGain, toneOsc, noiseGain, noiseSrc;
    let blowThreshold = 0.02;
    let currentMidi = 60;
    let noteIndex = 0;
    let ready = false;
    let booting = false;
    let timeData = new Float32Array(2048);
    /** true = hole covered (finger down). */
    const holesCovered = [true, true, true, true, true];
    const holeBtns = [];

    function indexToMidi(i) {
      const idx = Math.max(0, Math.min(9, Math.round(i)));
      return ROOT_MIDI + Math.floor(idx / 5) * 12 + PENTA[idx % 5];
    }

    function labelFromIndex(i) {
      const idx = Math.max(0, Math.min(9, Math.round(i)));
      return `${NOTE_NAMES[idx % 5]}${4 + Math.floor(idx / 5)}`;
    }

    /** Open holes from the bottom of the tube upward (hole 5 → 1). */
    function openStepsFromBottom() {
      let n = 0;
      for (let i = HOLE_COUNT - 1; i >= 0; i--) {
        if (!holesCovered[i]) n++;
        else break;
      }
      return n;
    }

    function applyFingering() {
      noteIndex = OPEN_TO_INDEX[openStepsFromBottom()];
      currentMidi = indexToMidi(noteIndex);
      document.getElementById("readout").textContent = labelFromIndex(noteIndex);
      holeBtns.forEach((btn, i) => {
        btn.classList.toggle("open", !holesCovered[i]);
        btn.classList.toggle("covered", holesCovered[i]);
        btn.setAttribute("aria-pressed", holesCovered[i] ? "true" : "false");
        btn.setAttribute("aria-label", `Hole ${i + 1} ${holesCovered[i] ? "covered" : "open"}`);
      });
      if (toneOsc && ctx) {
        toneOsc.frequency.setTargetAtTime(midiToFreq(currentMidi), ctx.currentTime, 0.03);
      }
    }

    function toggleHole(i) {
      holesCovered[i] = !holesCovered[i];
      applyFingering();
    }

    for (let i = 0; i < HOLE_COUNT; i++) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "flute-hole covered";
      btn.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        primeMicStream();
        void enableAudio();
        toggleHole(i);
      });
      fluteTube.appendChild(btn);
      holeBtns.push(btn);
    }
    applyFingering();

    function getRms() {
      if (!analyser) return 0;
      analyser.getFloatTimeDomainData(timeData);
      let s = 0;
      for (let i = 0; i < timeData.length; i++) s += timeData[i] ** 2;
      return Math.sqrt(s / timeData.length);
    }

    async function calibrate() {
      const samples = [];
      const t0 = performance.now();
      while (performance.now() - t0 < 600) {
        samples.push(getRms());
        await new Promise((r) => requestAnimationFrame(r));
      }
      const floor = samples.reduce((a, b) => a + b, 0) / samples.length;
      blowThreshold = Math.max(0.012, floor * 2.8 + 0.006);
      document.getElementById("breathWrap").style.setProperty("--thresh", `${Math.min(85, (blowThreshold / 0.12) * 100)}%`);
    }

    function createVoice() {
      toneGain = ctx.createGain();
      toneGain.gain.value = 0;
      toneOsc = ctx.createOscillator();
      toneOsc.type = "triangle";
      toneOsc.frequency.value = midiToFreq(currentMidi);
      const vib = ctx.createOscillator();
      const vibG = ctx.createGain();
      vib.frequency.value = 5.5;
      vibG.gain.value = 3;
      vib.connect(vibG);
      vibG.connect(toneOsc.frequency);
      vib.start();
      const f = ctx.createBiquadFilter();
      f.type = "lowpass";
      f.frequency.value = 2800;
      toneOsc.connect(f);
      f.connect(toneGain);
      toneGain.connect(master);
      toneOsc.start();
      noiseGain = ctx.createGain();
      noiseGain.gain.value = 0;
      const buf = ctx.createBuffer(1, ctx.sampleRate * 0.2, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * 0.5;
      noiseSrc = ctx.createBufferSource();
      noiseSrc.buffer = buf;
      noiseSrc.loop = true;
      const nf = ctx.createBiquadFilter();
      nf.type = "bandpass";
      nf.frequency.value = 1200;
      noiseSrc.connect(nf);
      nf.connect(noiseGain);
      noiseGain.connect(master);
      noiseSrc.start();
    }

    function tick() {
      if (!ready) return;
      const rms = getRms();
      document.getElementById("breathMeter").style.width = `${Math.min(100, (rms / 0.12) * 100)}%`;
      const blowing = rms > blowThreshold;
      document.getElementById("breathMeter").classList.toggle("blowing", blowing);
      const t = ctx.currentTime;
      if (blowing) {
        const s = Math.min(1, (rms - blowThreshold) / (0.12 - blowThreshold));
        toneGain.gain.setTargetAtTime(0.08 + s * 0.42, t, 0.02);
        noiseGain.gain.setTargetAtTime(s * 0.06, t, 0.02);
        toneOsc.frequency.setTargetAtTime(midiToFreq(currentMidi), t, 0.03);
      } else {
        toneGain.gain.setTargetAtTime(0, t, 0.06);
        noiseGain.gain.setTargetAtTime(0, t, 0.04);
      }
      requestAnimationFrame(tick);
    }

    async function boot(c) {
      if (ready) return;
      if (!navigator.mediaDevices?.getUserMedia) {
        setStatus("status", "Mic not supported", "warn");
        throw new Error("no mic");
      }
      ctx = c;
      ({ master } = createMasterBus(ctx, 0.55));
      try {
        micStream = await getMicStream();
      } catch {
        setStatus("status", "Mic denied — allow in Settings", "warn");
        throw new Error("denied");
      }
      analyser = ctx.createAnalyser();
      analyser.fftSize = 2048;
      timeData = new Float32Array(analyser.fftSize);
      connectMicAnalyser(ctx, micStream, analyser);
      createVoice();
      setStatus("status", "Calibrating… stay quiet", "");
      await calibrate();
      ready = true;
      setStatus("status", "Blow · tap holes for pitch", "ok");
      tick();
    }

    async function enableAudio() {
      if (ready || booting) return;
      booting = true;
      try {
        await startAudio(boot);
      } finally {
        booting = false;
      }
    }

    registerAudioBoot(boot, { mic: true });

    document.getElementById("fluteBody").addEventListener("pointerdown", (e) => {
      if (e.target.closest(".flute-hole")) return;
      primeMicStream();
      if (!ready) void enableAudio();
    });
  </script>
</body>
</html>
