<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Motion Wah — OMO</title>
  <link rel="stylesheet" href="../../shared/ui.css" />
  <style>
    .viz {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.35rem;
    }
    .phone-icon {
      width: 72px;
      height: 120px;
      border: 2px solid var(--accent);
      border-radius: 12px;
      transition: transform 0.1s ease-out;
    }
    .viz p {
      margin: 0;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .viz .meter {
      width: 70%;
    }
  </style>
</head>
<body class="app-shell">
  <header class="app-header">
    <a class="back-link" href="../../">←</a>
    <h1>Motion Wah</h1>
    <button type="button" class="learn-toggle" id="learnBtn">Learn</button>
  </header>
  <div class="learn-panel panel" id="learnPanel">
    <h2>Resonant filter</h2>
    <p>Tilt maps to a band-pass filter — wah / vowel sounds.</p>
  </div>
  <p class="status-bar" id="status">Start sound, allow motion</p>
  <div class="main-stage viz">
    <div class="phone-icon" id="phone"></div>
    <p>Tilt forward / back</p>
    <div class="meter"><div class="meter-fill" id="meter"></div></div>
  </div>
  <div class="app-toolbar">
    <button type="button" class="btn" id="startBtn">Start sound</button>
  </div>
  <script type="module">
    import { getAudioContext, unlockAudio, createMasterBus } from "../../shared/audio.js";
    import { enableSensors, onMotion, normalizeAccel } from "../../shared/sensors.js";

    const status = document.getElementById("status");
    const meter = document.getElementById("meter");
    const phone = document.getElementById("phone");
    let ctx, filter, osc, master, running = false;

    document.getElementById("learnBtn").onclick = () =>
      document.getElementById("learnPanel").classList.toggle("open");

    document.getElementById("startBtn").onclick = async () => {
      ctx = getAudioContext();
      await unlockAudio(ctx);
      ({ master } = createMasterBus(ctx, 0.5));
      osc = ctx.createOscillator();
      osc.type = "sawtooth";
      osc.frequency.value = 110;
      filter = ctx.createBiquadFilter();
      filter.type = "bandpass";
      filter.Q.value = 12;
      filter.frequency.value = 400;
      osc.connect(filter);
      filter.connect(master);
      osc.start();
      running = true;

      const ok = await enableSensors();
      if (!ok) {
        status.textContent = "Motion denied";
        status.classList.add("warn");
        return;
      }
      status.textContent = "Tilt to play";
      status.classList.add("ok");
      onMotion(({ x, y, z }) => {
        if (!running) return;
        const n = normalizeAccel(x, y, z);
        const tilt = (n.y + 1) / 2;
        filter.frequency.setTargetAtTime(150 + tilt * 3500, ctx.currentTime, 0.03);
        meter.style.width = `${tilt * 100}%`;
        phone.style.transform = `rotateX(${tilt * 40 - 20}deg)`;
      });
      document.getElementById("startBtn").disabled = true;
    };
  </script>
</body>
</html>
