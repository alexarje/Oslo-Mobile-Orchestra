<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Motion Wah — OMO</title>
  <link rel="stylesheet" href="../../shared/ui.css" />
  <style>
    .phone-icon {
      width: 72px;
      height: 120px;
      border: 2px solid var(--accent);
      border-radius: 12px;
      transition: transform 0.1s ease-out;
      flex-shrink: 0;
    }
    .touch-zone.active .phone-icon {
      border-color: var(--accent-dim);
      box-shadow: 0 0 16px rgba(110, 231, 183, 0.35);
    }
    .touch-zone p {
      margin: 0;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .touch-zone .meter {
      width: 70%;
      flex-shrink: 0;
    }
  </style>
</head>
<body class="app-shell">
  <header class="app-header">
    <a class="back-link" href="../../">←</a>
    <h1>Motion Wah</h1>
    <button type="button" class="learn-toggle" id="learnBtn">Learn</button>
  </header>
  <div class="learn-panel panel" id="learnPanel">
    <h2>Resonant filter</h2>
    <p>Hold the screen to play; tilt sweeps a band-pass filter.</p>
  </div>
  <p class="status-bar" id="status">Start sound, then hold &amp; tilt</p>
  <div class="main-stage">
    <div class="touch-zone" id="touchZone">
      <div class="phone-icon" id="phone"></div>
      <p>Hold here · tilt forward / back</p>
      <div class="meter"><div class="meter-fill" id="meter"></div></div>
    </div>
  </div>
  <div class="app-toolbar">
    <button type="button" class="btn" id="startBtn">Start sound</button>
  </div>
  <script type="module">
    import { getAudioContext, unlockAudio, createMasterBus } from "../../shared/audio.js";
    import { enableSensors, onMotion, normalizeAccel } from "../../shared/sensors.js";

    const status = document.getElementById("status");
    const meter = document.getElementById("meter");
    const phone = document.getElementById("phone");
    const touchZone = document.getElementById("touchZone");
    let ctx, filter, osc, gate, master, ready = false, holding = false;

    document.getElementById("learnBtn").onclick = () =>
      document.getElementById("learnPanel").classList.toggle("open");

    function release() {
      holding = false;
      touchZone.classList.remove("active");
      if (gate) gate.gain.setTargetAtTime(0, ctx.currentTime, 0.04);
      meter.style.width = "0%";
      phone.style.transform = "";
    }

    touchZone.addEventListener("pointerdown", (e) => {
      if (!ready) return;
      touchZone.setPointerCapture(e.pointerId);
      holding = true;
      touchZone.classList.add("active");
      gate.gain.setTargetAtTime(0.5, ctx.currentTime, 0.02);
    });
    touchZone.addEventListener("pointerup", release);
    touchZone.addEventListener("pointercancel", release);
    touchZone.addEventListener("lostpointercapture", release);

    document.getElementById("startBtn").onclick = async () => {
      ctx = getAudioContext();
      await unlockAudio(ctx);
      ({ master } = createMasterBus(ctx, 0.5));
      gate = ctx.createGain();
      gate.gain.value = 0;
      osc = ctx.createOscillator();
      osc.type = "sawtooth";
      osc.frequency.value = 110;
      filter = ctx.createBiquadFilter();
      filter.type = "bandpass";
      filter.Q.value = 12;
      filter.frequency.value = 400;
      osc.connect(filter);
      filter.connect(gate);
      gate.connect(master);
      osc.start();
      ready = true;

      const ok = await enableSensors();
      if (!ok) {
        status.textContent = "Motion denied — hold still plays";
        status.classList.add("warn");
      } else {
        status.textContent = "Hold screen & tilt";
        status.classList.add("ok");
      }
      onMotion(({ x, y, z }) => {
        if (!ready || !holding) return;
        const n = normalizeAccel(x, y, z);
        const tilt = (n.y + 1) / 2;
        filter.frequency.setTargetAtTime(150 + tilt * 3500, ctx.currentTime, 0.03);
        meter.style.width = `${tilt * 100}%`;
        phone.style.transform = `rotateX(${tilt * 40 - 20}deg)`;
      });
      document.getElementById("startBtn").disabled = true;
    };
  </script>
</body>
</html>
