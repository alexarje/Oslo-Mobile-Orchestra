<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f14" />
  <title>Motion Wah — OMO</title>
  <link rel="stylesheet" href="../../shared/ui.css" />
</head>
<body class="app-shell">
  <header class="app-header">
    <a class="back-link" href="../../">←</a>
    <h1>Motion Wah</h1>
    <button type="button" class="learn-toggle" id="learnBtn">Learn</button>
  </header>
  <div class="learn-panel panel" id="learnPanel">
    <h2>Resonant filter</h2>
    <p>Hold to play; tilt sweeps a band-pass filter. Toggle <strong>Continuous</strong> to keep sound on without holding.</p>
  </div>
  <div class="control-row">
    <label class="slide-toggle"><input type="checkbox" id="continuous" /> Continuous</label>
  </div>
  <div class="main-stage">
    <div class="touch-zone" id="touchZone">
      <div class="phone-icon" id="phone"></div>
      <div class="meter"><div class="meter-fill" id="meter"></div></div>
    </div>
  </div>
  <script type="module">
    import { bindLearn, startAudio } from "../../shared/app.js";
    import { createMasterBus } from "../../shared/audio.js";
    import { enableSensors, onMotion, normalizeAccel } from "../../shared/sensors.js";

    bindLearn();
    const touchZone = document.getElementById("touchZone");
    const meter = document.getElementById("meter");
    const phone = document.getElementById("phone");
    let ctx, filter, osc, gate, master;
    let built = false;
    let sensorsOn = false;
    let holding = false;
    let continuous = false;
    let activePointer = null;

    function buildVoice(c) {
      ctx = c;
      ({ master } = createMasterBus(ctx, 0.5));
      gate = ctx.createGain();
      gate.gain.value = 0;
      osc = ctx.createOscillator();
      osc.type = "sawtooth";
      osc.frequency.value = 110;
      filter = ctx.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.value = 800;
      filter.Q.value = 12;
      osc.connect(filter);
      filter.connect(gate);
      gate.connect(master);
      osc.start();
      built = true;
    }

    async function enableTilt() {
      if (sensorsOn) return;
      if (await enableSensors()) {
        sensorsOn = true;
        onMotion(({ x, y, z }) => {
          if ((!holding && !continuous) || !built) return;
          const tilt = (normalizeAccel(x, y, z).y + 1) / 2;
          filter.frequency.setTargetAtTime(150 + tilt * 3500, ctx.currentTime, 0.03);
          meter.style.width = `${tilt * 100}%`;
          phone.style.transform = `rotateX(${tilt * 40 - 20}deg)`;
        });
      }
    }

    function release(e) {
      if (e && e.pointerId !== activePointer) return;
      holding = false;
      activePointer = null;
      if (continuous) return;
      touchZone.classList.remove("active");
      if (gate && ctx) gate.gain.setTargetAtTime(0, ctx.currentTime, 0.04);
      meter.style.width = "0%";
      phone.style.transform = "";
    }

    touchZone.addEventListener("pointerdown", async (e) => {
      e.preventDefault();
      await startAudio(!built ? (c) => { buildVoice(c); void enableTilt(); } : undefined);
      activePointer = e.pointerId;
      touchZone.setPointerCapture(e.pointerId);
      holding = true;
      touchZone.classList.add("active");
      gate.gain.setTargetAtTime(0.5, ctx.currentTime, 0.02);
    });

    touchZone.addEventListener("pointerup", release);
    touchZone.addEventListener("pointercancel", release);
    touchZone.addEventListener("lostpointercapture", release);

    document.getElementById("continuous").onchange = async (e) => {
      continuous = e.target.checked;
      if (continuous) {
        await startAudio(!built ? (c) => { buildVoice(c); void enableTilt(); } : undefined);
        gate.gain.setTargetAtTime(0.5, ctx.currentTime, 0.05);
        touchZone.classList.add("active");
      } else if (!holding) {
        release();
      }
    };
  </script>
</body>
</html>
