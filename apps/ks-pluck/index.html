<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f14" />
  <title>KS Pluck — OMO</title>
  <link rel="stylesheet" href="../../shared/ui.css" />
</head>
<body class="app-shell">
  <header class="app-header">
    <a class="back-link" href="../../">←</a>
    <h1>KS Pluck</h1>
  </header>
  <div class="learn-panel panel" id="learnPanel">
    <h2>Karplus–Strong</h2>
    <p>Turn <strong>Audio on</strong>, then <strong>Tap</strong> to excite a delay-line string. <strong>X</strong> = pitch. Feedback is kept moderate so rapid taps stay clean.</p>
    <p>For hold-to-pluck + tilt damping, try <a href="../ks-string/">Karplus–Strong String</a>.</p>
  </div>
  <div class="readout-row">
    <p class="value-chip">Pitch <strong id="freqOut">220</strong> Hz</p>
  </div>
  <div class="main-stage">
    <div id="pad" class="stage-fill play-grid"></div>
  </div>
  <script type="module">
    import { bindLearn, startAudio } from "../../shared/app.js";
    import { createMasterBus } from "../../shared/audio.js";
    import { createKSPool, karplusPluck } from "../../shared/ks.js";

    bindLearn();
    const pad = document.getElementById("pad");
    let ctx, master, built = false;
    const pool = createKSPool(2);

    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const mapX = (nx) => 55 * Math.pow(880 / 55, nx);

    function buildAudio(c) {
      ctx = c;
      ({ master } = createMasterBus(c, 0.38));
      built = true;
    }

    pad.addEventListener("pointerdown", async (e) => {
      e.preventDefault();
      await startAudio(!built ? buildAudio : undefined);
      if (!built) return;
      const r = pad.getBoundingClientRect();
      const nx = clamp((e.clientX - r.left) / r.width, 0, 1);
      const freq = mapX(nx);
      karplusPluck(ctx, master, pool, freq, {
        strength: 0.36,
        level: 0.18,
        feedback: 0.8,
        dampHz: Math.min(5200, Math.max(500, freq * 5)),
        decaySec: 1.6,
      });
      document.getElementById("freqOut").textContent = freq.toFixed(0);
      const ripple = document.createElement("div");
      ripple.className = "pluck-ripple";
      ripple.style.left = `${e.clientX - r.left}px`;
      ripple.style.top = `${e.clientY - r.top}px`;
      pad.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    });
  </script>
</body>
</html>
