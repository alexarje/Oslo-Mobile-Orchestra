<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Conductor — OMO</title>
  <link rel="stylesheet" href="../../shared/ui.css" />
  <style>
    .cond-panel {
      flex-shrink: 0;
      margin: 0.35rem 0.5rem;
      padding: 0.5rem;
      font-size: 0.75rem;
    }
    .cond-panel p { margin: 0.25rem 0; }
  </style>
</head>
<body class="app-shell">
  <header class="app-header">
    <a class="back-link" href="../../">←</a>
    <h1>Conductor</h1>
  </header>
  <div class="role-tabs">
    <button type="button" id="tabCond" class="active">Conduct</button>
    <button type="button" id="tabMus">Play</button>
  </div>

  <div id="conductorView" class="main-stage">
    <div class="control-row">
      <label for="bpm">BPM</label>
      <input type="range" id="bpm" min="60" max="140" value="96" />
      <span id="bpmVal">96</span>
    </div>
    <div class="countdown-lg" id="countdown">Ready</div>
    <div class="scroll-panel hidden" id="sharePanel">
      <div class="qr-share">
        <canvas id="shareQr" role="img" aria-label="QR code — scan to join"></canvas>
        <p class="qr-caption">Scan to join · same countdown</p>
      </div>
      <p style="margin:0 0 0.35rem;font-size:0.75rem;color:var(--muted);">Musician link</p>
      <div class="link-box" id="musicianLink"></div>
    </div>
    <div class="app-toolbar">
      <button type="button" class="btn" id="goBtn">Countdown 5s</button>
      <button type="button" class="btn-secondary btn btn-sm icon-only hidden" id="copyBtn" title="Copy">⎘</button>
    </div>
  </div>

  <div id="musicianView" class="main-stage hidden">
    <p class="status-bar" id="joinInfo">Waiting…</p>
    <div class="countdown-lg" id="musCountdown">—</div>
    <div class="scroll-panel">
      <p style="margin:0;font-size:0.72rem;color:var(--muted);">BPM <strong id="joinBpm">—</strong> · <span id="joinStart">—</span></p>
      <p style="margin:0.35rem 0 0;font-size:0.72rem;"><a href="../pulse-grid/">Pulse Grid</a> link:</p>
      <div class="link-box" id="pulseLink"></div>
    </div>
    <div class="app-toolbar">
      <a class="btn" href="../../" style="text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;">Apps</a>
    </div>
  </div>

  <script type="module">
    import { renderQrCanvas } from "../../shared/qr.js";

    const params = new URLSearchParams(location.search);
    const isMusician = params.has("start");

    const conductorView = document.getElementById("conductorView");
    const musicianView = document.getElementById("musicianView");
    const tabCond = document.getElementById("tabCond");
    const tabMus = document.getElementById("tabMus");

    function showRole(musician) {
      conductorView.classList.toggle("hidden", musician);
      musicianView.classList.toggle("hidden", !musician);
      tabCond.classList.toggle("active", !musician);
      tabMus.classList.toggle("active", musician);
    }

    tabCond.onclick = () => { history.replaceState({}, "", location.pathname); showRole(false); };
    tabMus.onclick = () => showRole(true);

    document.getElementById("bpm").oninput = (e) => {
      document.getElementById("bpmVal").textContent = e.target.value;
    };

    function buildMusicianUrl(startMs, bpm) {
      const u = new URL(location.href);
      u.searchParams.set("start", String(startMs));
      u.searchParams.set("bpm", String(bpm));
      return u.toString();
    }

    function buildPulseUrl(startMs, bpm) {
      const u = new URL("../pulse-grid/", location.href);
      u.searchParams.set("start", String(startMs));
      u.searchParams.set("bpm", String(bpm));
      return u.toString();
    }

    document.getElementById("goBtn").onclick = () => {
      const bpm = document.getElementById("bpm").value;
      const startMs = Date.now() + 5000;
      const url = buildMusicianUrl(startMs, bpm);
      document.getElementById("sharePanel").classList.remove("hidden");
      document.getElementById("musicianLink").textContent = url;
      renderQrCanvas(document.getElementById("shareQr"), url, { scale: 4, border: 2 });
      document.getElementById("copyBtn").classList.remove("hidden");
      runCountdown(document.getElementById("countdown"), startMs, () => {
        document.getElementById("countdown").textContent = "Go!";
      });
    };

    document.getElementById("copyBtn").onclick = () => {
      navigator.clipboard?.writeText(document.getElementById("musicianLink").textContent);
    };

    function runCountdown(el, startMs, onZero) {
      const tick = () => {
        const left = startMs - Date.now();
        if (left <= 0) {
          el.textContent = "0";
          onZero?.();
          return;
        }
        el.textContent = String(Math.ceil(left / 1000));
        requestAnimationFrame(tick);
      };
      tick();
    }

    if (isMusician) {
      showRole(true);
      const startMs = parseInt(params.get("start"), 10);
      const bpm = params.get("bpm") || "96";
      document.getElementById("joinBpm").textContent = bpm;
      document.getElementById("joinStart").textContent = new Date(startMs).toLocaleTimeString();
      document.getElementById("joinInfo").textContent = "Countdown";
      document.getElementById("pulseLink").textContent = buildPulseUrl(startMs, bpm);
      runCountdown(document.getElementById("musCountdown"), startMs, () => {
        document.getElementById("musCountdown").textContent = "Go!";
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g);
          g.connect(ctx.destination);
          o.frequency.value = 880;
          g.gain.setValueAtTime(0.3, ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
          o.start();
          o.stop(ctx.currentTime + 0.35);
        } catch {}
      });
    }
  </script>
</body>
</html>
