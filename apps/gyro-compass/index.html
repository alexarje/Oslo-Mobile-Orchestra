<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f14" />
  <title>Gyro Compass — OMO</title>
  <link rel="stylesheet" href="../../shared/ui.css" />
</head>
<body class="app-shell gyro-compass-app">
  <header class="app-header">
    <a class="back-link" href="../../">←</a>
    <h1>Gyro Compass</h1>
  </header>
  <div class="learn-panel panel" id="learnPanel">
    <h2>Pan + pitch</h2>
    <p>Turn <strong>Audio on</strong>, tap the compass, and allow <strong>orientation</strong> on iPhone.</p>
    <p>Hold the phone <strong>flat</strong> and rotate — the <strong>needle</strong> shows heading. <strong>Tilt</strong> or drag vertically for pitch.</p>
  </div>
  <p class="status-bar" id="status">Tap compass · Audio on</p>
  <div class="readout-row">
    <p class="value-chip">Heading <strong id="headOut">—</strong>°</p>
    <p class="value-chip">Pan <strong id="panOut">—</strong></p>
    <p class="value-chip">Pitch <strong id="pitchOut">—</strong></p>
  </div>
  <div class="main-stage">
    <canvas id="compass" class="canvas-fill" aria-label="Compass"></canvas>
  </div>
  <script type="module">
    import { bindLearn, registerAudioBoot, setStatus, startAudio } from "../../shared/app.js";
    import { createMasterBus, midiToFreq } from "../../shared/audio.js";
    import { drawCompassRose, sizeCompassCanvas } from "../../shared/compass-rose.js";
    import { enableSensors, onOrientation, primeSensors } from "../../shared/sensors.js";

    bindLearn();
    const canvas = document.getElementById("compass");
    const g = canvas.getContext("2d");
    const NOTE_NAMES = ["C", "C♯", "D", "E♭", "E", "F", "F♯", "G", "A♭", "A", "B♭", "B"];
    const MIDI_MIN = 48;
    const MIDI_MAX = 76;
    const SENSOR_OPTS = { needMotion: false, needOrientation: true };
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
    const safeNum = (v, fb) => (typeof v === "number" && Number.isFinite(v) ? v : fb);

    let ctx, panner, osc, built = false;
    let sensorsReady = false;
    let alpha = 0;
    let beta = 90;
    let touchMidi = null;
    let activePointer = null;

    function labelFromMidi(midi) {
      const n = Math.round(midi);
      return `${NOTE_NAMES[((n % 12) + 12) % 12]}${Math.floor(n / 12) - 1}`;
    }

    function midiFromBeta(b) {
      const t = clamp((safeNum(b, 90) - 25) / 110, 0, 1);
      return MIDI_MIN + t * (MIDI_MAX - MIDI_MIN);
    }

    function midiFromTouchY(clientY) {
      const r = canvas.getBoundingClientRect();
      const ny = 1 - clamp((clientY - r.top) / Math.max(1, r.height), 0, 1);
      return MIDI_MIN + ny * (MIDI_MAX - MIDI_MIN);
    }

    function headingFromOrientation(o) {
      if (typeof o.webkitCompassHeading === "number" && Number.isFinite(o.webkitCompassHeading)) {
        return o.webkitCompassHeading;
      }
      if (typeof o.alpha === "number" && Number.isFinite(o.alpha)) return o.alpha;
      return alpha;
    }

    function currentMidi() {
      return touchMidi ?? midiFromBeta(beta);
    }

    function draw() {
      const { w, h, dpr } = sizeCompassCanvas(canvas);
      const midi = currentMidi();
      const pitchT = (midi - MIDI_MIN) / (MIDI_MAX - MIDI_MIN);
      drawCompassRose(g, w, h, dpr, {
        heading: alpha,
        beta,
        showPitchLane: true,
        pitchT,
        touchPitch: touchMidi != null,
      });
    }

    function applyMotion() {
      if (!built || !ctx) return;
      const t = ctx.currentTime;
      const midi = currentMidi();
      const pan = Math.sin((alpha * Math.PI) / 180);
      panner.pan.setTargetAtTime(pan, t, 0.05);
      osc.frequency.setTargetAtTime(midiToFreq(midi), t, 0.05);
      document.getElementById("headOut").textContent = alpha.toFixed(0);
      document.getElementById("panOut").textContent = pan.toFixed(2);
      document.getElementById("pitchOut").textContent = labelFromMidi(midi);
      draw();
    }

    function buildAudio(c) {
      ctx = c;
      ({ master } = createMasterBus(c, 0.48));
      panner = c.createStereoPanner();
      osc = c.createOscillator();
      osc.type = "sine";
      osc.frequency.value = midiToFreq(60);
      osc.connect(panner);
      panner.connect(master);
      osc.start();
      built = true;
      applyMotion();
    }

    registerAudioBoot(buildAudio);

    async function initSensors() {
      if (sensorsReady) return true;
      const ok = await enableSensors(SENSOR_OPTS);
      if (!ok) {
        setStatus("status", "Allow orientation access in Settings", "warn");
        draw();
        return false;
      }
      onOrientation((o) => {
        alpha = headingFromOrientation(o);
        const b = safeNum(o.beta, beta);
        if (Number.isFinite(b) && b !== 0) beta = clamp(b, 20, 160);
        else {
          const gam = safeNum(o.gamma, 0);
          if (gam !== 0) beta = clamp(90 - gam, 20, 160);
        }
        if (activePointer == null) applyMotion();
        else draw();
      });
      sensorsReady = true;
      setStatus("status", "Flat · rotate for pan · tilt for pitch", "ok");
      applyMotion();
      return true;
    }

    async function boot(e) {
      primeSensors(SENSOR_OPTS);
      await startAudio(!built ? buildAudio : undefined);
      await initSensors();
      if (e) {
        activePointer = e.pointerId;
        canvas.setPointerCapture(e.pointerId);
        touchMidi = midiFromTouchY(e.clientY);
        applyMotion();
      }
    }

    canvas.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      void boot(e);
    });
    canvas.addEventListener("pointermove", (e) => {
      if (e.pointerId !== activePointer) return;
      touchMidi = midiFromTouchY(e.clientY);
      applyMotion();
    });
    const endTouch = (e) => {
      if (e.pointerId !== activePointer) return;
      activePointer = null;
      touchMidi = null;
      applyMotion();
    };
    canvas.addEventListener("pointerup", endTouch);
    canvas.addEventListener("pointercancel", endTouch);

    new ResizeObserver(() => draw()).observe(canvas.parentElement);
    requestAnimationFrame(() => draw());
  </script>
</body>
</html>
