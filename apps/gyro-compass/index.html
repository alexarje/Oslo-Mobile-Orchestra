<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f14" />
  <title>Gyro Compass — OMO</title>
  <link rel="stylesheet" href="../../shared/ui.css" />
</head>
<body class="app-shell gyro-compass-app">
  <header class="app-header">
    <a class="back-link" href="../../">←</a>
    <h1>Gyro Compass</h1>
  </header>
  <div class="learn-panel panel" id="learnPanel">
    <h2>Pan + pitch</h2>
    <p>Turn <strong>Audio on</strong>, tap the compass, allow <strong>orientation</strong> and <strong>motion</strong> on iPhone.</p>
    <p><strong>Hold</strong> the compass rose to play. <strong>Rotate</strong> for pan · <strong>tilt</strong> or drag for pitch · <strong>move</strong> the phone for vibrato.</p>
  </div>
  <p class="status-bar" id="status">Hold compass rose · Audio on</p>
  <div class="readout-row">
    <p class="value-chip">Heading <strong id="headOut">—</strong>°</p>
    <p class="value-chip">Pan <strong id="panOut">—</strong></p>
    <p class="value-chip">Pitch <strong id="pitchOut">—</strong></p>
    <p class="value-chip">Amp <strong id="ampOut">—</strong></p>
    <p class="value-chip">Vib <strong id="vibOut">—</strong></p>
  </div>
  <div class="main-stage">
    <canvas id="compass" class="canvas-fill play-grid" aria-label="Compass"></canvas>
  </div>
  <script type="module">
    import { bindLearn, registerAudioBoot, setStatus, startAudio } from "../../shared/app.js";
    import { createMasterBus, midiToFreq } from "../../shared/audio.js";
    import { drawCompassRose, sizeCompassCanvas } from "../../shared/compass-rose.js";
    import { createMotionExpression } from "../../shared/motion-express.js";
    import { enableSensors, onMotion, onOrientation, primeSensors } from "../../shared/sensors.js";

    bindLearn();
    const canvas = document.getElementById("compass");
    const g = canvas.getContext("2d");
    const NOTE_NAMES = ["C", "C♯", "D", "E♭", "E", "F", "F♯", "G", "A♭", "A", "B♭", "B"];
    const MIDI_MIN = 48;
    const MIDI_MAX = 76;
    const SENSOR_OPTS = { needMotion: true, needOrientation: true };
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
    const safeNum = (v, fb) => (typeof v === "number" && Number.isFinite(v) ? v : fb);

    const motionExpr = createMotionExpression({ baseAmp: 0.2 });
    let motion = { amp: 0.2, vibCents: 0, vibHz: 5 };

    let ctx, panner, osc, toneGain, vibOsc, vibGain, built = false;
    let sensorsReady = false;
    let alpha = 0;
    let beta = 90;
    let touchMidi = null;
    let activePointer = null;
    let holding = false;

    function labelFromMidi(midi) {
      const n = Math.round(midi);
      return `${NOTE_NAMES[((n % 12) + 12) % 12]}${Math.floor(n / 12) - 1}`;
    }

    function midiFromBeta(b) {
      const t = clamp((safeNum(b, 90) - 25) / 110, 0, 1);
      return MIDI_MIN + t * (MIDI_MAX - MIDI_MIN);
    }

    function midiFromTouchY(clientY) {
      const r = canvas.getBoundingClientRect();
      const ny = 1 - clamp((clientY - r.top) / Math.max(1, r.height), 0, 1);
      return MIDI_MIN + ny * (MIDI_MAX - MIDI_MIN);
    }

    function headingFromOrientation(o) {
      if (typeof o.webkitCompassHeading === "number" && Number.isFinite(o.webkitCompassHeading)) {
        return o.webkitCompassHeading;
      }
      if (typeof o.alpha === "number" && Number.isFinite(o.alpha)) return o.alpha;
      return alpha;
    }

    function currentMidi() {
      return touchMidi ?? midiFromBeta(beta);
    }

    function draw() {
      const { w, h, dpr } = sizeCompassCanvas(canvas);
      const midi = currentMidi();
      const pitchT = (midi - MIDI_MIN) / (MIDI_MAX - MIDI_MIN);
      drawCompassRose(g, w, h, dpr, {
        heading: alpha,
        beta,
        showPitchLane: true,
        pitchT,
        touchPitch: touchMidi != null,
      });
    }

    function applyVoice() {
      if (!built || !ctx) return;
      const t = ctx.currentTime;
      const midi = currentMidi();
      document.getElementById("headOut").textContent = alpha.toFixed(0);
      document.getElementById("pitchOut").textContent = labelFromMidi(midi);
      if (!holding) {
        toneGain.gain.setTargetAtTime(0, t, 0.05);
        vibGain.gain.setTargetAtTime(0, t, 0.05);
        document.getElementById("panOut").textContent = "—";
        document.getElementById("ampOut").textContent = "—";
        document.getElementById("vibOut").textContent = "—";
        draw();
        return;
      }
      const pan = Math.sin((alpha * Math.PI) / 180);
      panner.pan.setTargetAtTime(pan, t, 0.05);
      osc.frequency.setTargetAtTime(midiToFreq(midi), t, 0.05);
      toneGain.gain.setTargetAtTime(0.12 + motion.amp * 0.42, t, 0.06);
      vibGain.gain.setTargetAtTime(motion.vibCents, t, 0.07);
      vibOsc.frequency.setTargetAtTime(motion.vibHz, t, 0.08);
      document.getElementById("panOut").textContent = pan.toFixed(2);
      document.getElementById("ampOut").textContent = `${(motion.amp * 100).toFixed(0)}%`;
      document.getElementById("vibOut").textContent = motion.vibCents.toFixed(1);
      draw();
    }

    function buildAudio(c) {
      ctx = c;
      ({ master } = createMasterBus(c, 0.48));
      panner = c.createStereoPanner();
      toneGain = c.createGain();
      toneGain.gain.value = 0.2;
      osc = c.createOscillator();
      osc.type = "sine";
      osc.frequency.value = midiToFreq(60);
      vibOsc = c.createOscillator();
      vibGain = c.createGain();
      vibOsc.type = "sine";
      vibOsc.frequency.value = 5;
      vibGain.gain.value = 0;
      vibOsc.connect(vibGain);
      vibGain.connect(osc.detune);
      osc.connect(toneGain);
      toneGain.connect(panner);
      panner.connect(master);
      osc.start();
      vibOsc.start();
      built = true;
      toneGain.gain.value = 0;
      draw();
    }

    registerAudioBoot(buildAudio);

    async function initSensors() {
      if (sensorsReady) return true;
      const ok = await enableSensors(SENSOR_OPTS);
      if (!ok) {
        setStatus("status", "Allow orientation + motion in Settings", "warn");
        draw();
        return false;
      }
      onOrientation((o) => {
        alpha = headingFromOrientation(o);
        const b = safeNum(o.beta, beta);
        if (Number.isFinite(b) && b !== 0) beta = clamp(b, 20, 160);
        else {
          const gam = safeNum(o.gamma, 0);
          if (gam !== 0) beta = clamp(90 - gam, 20, 160);
        }
        if (holding) applyVoice();
        else draw();
      });
      onMotion((data) => {
        if (!holding) return;
        motion = motionExpr.update(data);
        applyVoice();
      });
      sensorsReady = true;
      setStatus("status", "Hold compass rose to play", "ok");
      draw();
      return true;
    }

    async function boot(e) {
      primeSensors(SENSOR_OPTS);
      await startAudio(!built ? buildAudio : undefined);
      await initSensors();
      holding = true;
      activePointer = e.pointerId;
      canvas.setPointerCapture(e.pointerId);
      canvas.classList.add("active");
      touchMidi = midiFromTouchY(e.clientY);
      motionExpr.reset();
      motion = motionExpr.update({ x: 0, y: 0, z: 0 });
      applyVoice();
    }

    canvas.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      void boot(e);
    });
    canvas.addEventListener("pointermove", (e) => {
      if (e.pointerId !== activePointer) return;
      touchMidi = midiFromTouchY(e.clientY);
      applyVoice();
    });
    const endTouch = (e) => {
      if (e.pointerId !== activePointer) return;
      holding = false;
      activePointer = null;
      touchMidi = null;
      canvas.classList.remove("active");
      applyVoice();
    };
    canvas.addEventListener("pointerup", endTouch);
    canvas.addEventListener("pointercancel", endTouch);
    canvas.addEventListener("lostpointercapture", endTouch);

    new ResizeObserver(() => draw()).observe(canvas.parentElement);
    requestAnimationFrame(() => draw());
  </script>
</body>
</html>
