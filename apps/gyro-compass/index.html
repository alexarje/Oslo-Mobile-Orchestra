<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f14" />
  <title>Gyro Compass — OMO</title>
  <link rel="stylesheet" href="../../shared/ui.css" />
</head>
<body class="app-shell gyro-compass-app">
  <header class="app-header">
    <a class="back-link" href="../../">←</a>
    <h1>Gyro Compass</h1>
  </header>
  <div class="learn-panel panel" id="learnPanel">
    <h2>Pan + pitch</h2>
    <p>Tap the compass and allow <strong>motion/orientation</strong> on iPhone. Hold the phone flat and rotate for stereo pan.</p>
    <p><strong>Tilt</strong> forward/back for pitch, or drag up/down on the circle.</p>
  </div>
  <p class="status-bar" id="status">Tap compass · Audio on</p>
  <div class="readout-row">
    <p class="value-chip">Heading <strong id="headOut">—</strong>°</p>
    <p class="value-chip">Pan <strong id="panOut">—</strong></p>
    <p class="value-chip">Pitch <strong id="pitchOut">—</strong></p>
  </div>
  <div class="main-stage">
    <canvas id="compass" class="canvas-fill"></canvas>
  </div>
  <script type="module">
    import { bindLearn, setStatus, startAudio } from "../../shared/app.js";
    import { createMasterBus, midiToFreq } from "../../shared/audio.js";
    import { enableSensors, onOrientation, primeSensors } from "../../shared/sensors.js";

    bindLearn();
    const canvas = document.getElementById("compass");
    const g = canvas.getContext("2d");
    const NOTE_NAMES = ["C", "C♯", "D", "E♭", "E", "F", "F♯", "G", "A♭", "A", "B♭", "B"];
    const MIDI_MIN = 48;
    const MIDI_MAX = 76;
    const SENSOR_OPTS = { needMotion: false, needOrientation: true };

    let ctx, panner, osc, built = false;
    let sensorsReady = false;
    let alpha = 0;
    let beta = 90;
    let touchMidi = null;
    let activePointer = null;

    function labelFromMidi(midi) {
      const n = Math.round(midi);
      return `${NOTE_NAMES[((n % 12) + 12) % 12]}${Math.floor(n / 12) - 1}`;
    }

    function midiFromBeta(b) {
      const t = Math.max(0, Math.min(1, (b - 25) / 110));
      return MIDI_MIN + t * (MIDI_MAX - MIDI_MIN);
    }

    function midiFromTouchY(clientY) {
      const r = canvas.getBoundingClientRect();
      const ny = 1 - Math.max(0, Math.min(1, (clientY - r.top) / r.height));
      return MIDI_MIN + ny * (MIDI_MAX - MIDI_MIN);
    }

    function currentMidi() {
      return touchMidi ?? midiFromBeta(beta);
    }

    function applyMotion() {
      if (!built || !ctx) return;
      const t = ctx.currentTime;
      const midi = currentMidi();
      const pan = Math.sin((alpha * Math.PI) / 180);
      panner.pan.setTargetAtTime(pan, t, 0.05);
      osc.frequency.setTargetAtTime(midiToFreq(midi), t, 0.05);
      document.getElementById("headOut").textContent = alpha.toFixed(0);
      document.getElementById("panOut").textContent = pan.toFixed(2);
      document.getElementById("pitchOut").textContent = labelFromMidi(midi);
      draw();
    }

    function buildAudio(c) {
      ctx = c;
      ({ master } = createMasterBus(c, 0.4));
      panner = c.createStereoPanner();
      osc = c.createOscillator();
      osc.type = "sine";
      osc.frequency.value = midiToFreq(60);
      osc.connect(panner);
      panner.connect(master);
      osc.start();
      built = true;
      applyMotion();
    }

    async function initSensors() {
      if (sensorsReady) return true;
      const ok = await enableSensors(SENSOR_OPTS);
      if (!ok) {
        setStatus("status", "Motion blocked — allow orientation in Settings", "warn");
        return false;
      }
      onOrientation((o) => {
        if (o.alpha != null && !Number.isNaN(o.alpha)) alpha = o.alpha;
        if (o.beta != null && !Number.isNaN(o.beta)) beta = o.beta;
        else if (o.gamma != null && !Number.isNaN(o.gamma)) beta = 90 - o.gamma;
        if (activePointer == null) applyMotion();
      });
      sensorsReady = true;
      setStatus("status", "Rotate flat for pan · tilt for pitch", "ok");
      applyMotion();
      return true;
    }

    function draw() {
      const box = canvas.parentElement.getBoundingClientRect();
      const dpr = devicePixelRatio || 1;
      canvas.width = box.width * dpr;
      canvas.height = box.height * dpr;
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const r = Math.min(w, h) * 0.35;
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.fillStyle = "#0f172a";
      g.fillRect(0, 0, w, h);

      const midi = currentMidi();
      const pitchT = (midi - MIDI_MIN) / (MIDI_MAX - MIDI_MIN);
      const pitchY = cy + r * 0.55 - pitchT * r * 1.1;
      g.fillStyle = "rgba(110, 231, 183, 0.15)";
      g.beginPath();
      g.arc(cx, pitchY, 10 * dpr, 0, Math.PI * 2);
      g.fill();

      g.strokeStyle = "#334155";
      g.beginPath();
      g.arc(cx, cy, r, 0, Math.PI * 2);
      g.stroke();
      const a = ((alpha - 90) * Math.PI) / 180;
      g.strokeStyle = "#6ee7b7";
      g.lineWidth = 3 * dpr;
      g.beginPath();
      g.moveTo(cx, cy);
      g.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
      g.stroke();

      g.strokeStyle = "#64748b";
      g.setLineDash([4 * dpr, 4 * dpr]);
      g.beginPath();
      g.moveTo(cx, cy - r * 0.55);
      g.lineTo(cx, cy + r * 0.55);
      g.stroke();
      g.setLineDash([]);
    }

    async function boot(e) {
      primeSensors(SENSOR_OPTS);
      await startAudio(!built ? buildAudio : undefined);
      await initSensors();
      if (e) {
        activePointer = e.pointerId;
        canvas.setPointerCapture(e.pointerId);
        touchMidi = midiFromTouchY(e.clientY);
        applyMotion();
      }
    }

    canvas.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      void boot(e);
    });
    canvas.addEventListener("pointermove", (e) => {
      if (e.pointerId !== activePointer) return;
      touchMidi = midiFromTouchY(e.clientY);
      applyMotion();
    });
    const endTouch = (e) => {
      if (e.pointerId !== activePointer) return;
      activePointer = null;
      touchMidi = null;
      applyMotion();
    };
    canvas.addEventListener("pointerup", endTouch);
    canvas.addEventListener("pointercancel", endTouch);

    new ResizeObserver(() => {
      if (built) draw();
    }).observe(canvas.parentElement);
  </script>
</body>
</html>
