<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f14" />
  <title>Bow Phone — OMO</title>
  <link rel="stylesheet" href="../../shared/ui.css" />
</head>
<body class="app-shell bow-phone-app">
  <header class="app-header">
    <a class="back-link" href="../../">←</a>
    <h1>Bow Phone</h1>
  </header>
  <div class="learn-panel panel" id="learnPanel">
    <h2>Bowed string</h2>
    <p>Turn <strong>Audio on</strong>, <strong>hold</strong> the pad for pitch (up = high), then <strong>rock the phone back and forth</strong> like a bow — more motion = more sound.</p>
    <p>Allow <strong>motion</strong> when asked on iPhone. Sound fades when you stop moving.</p>
  </div>
  <div class="breath-row">
    <label>Bow</label>
    <div class="breath-meter" id="bowMeterWrap">
      <div class="breath-meter-fill" id="bowMeter"></div>
    </div>
  </div>
  <div class="readout-row">
    <p class="value-chip">Pitch <strong id="pOut">220</strong> Hz</p>
    <p class="value-chip">Motion <strong id="bOut">0</strong></p>
  </div>
  <div class="main-stage">
    <div id="pad" class="stage-fill play-grid"><div class="touch-dot" id="dot"></div></div>
  </div>
  <script type="module">
    import { bindLearn, startAudio } from "../../shared/app.js";
    import { createMasterBus } from "../../shared/audio.js";
    import { enableSensors, onMotion, primeSensors } from "../../shared/sensors.js";

    bindLearn();
    const pad = document.getElementById("pad");
    const dot = document.getElementById("dot");
    const SENSOR_OPTS = { needMotion: true, needOrientation: false };

    let ctx, master, osc, noise, noiseGain, toneGain, built = false;
    let sensorsReady = false;
    let holding = false;
    let activePointer = null;
    let bowEnergy = 0;
    let lastAccel = { x: 0, y: 0, z: 0 };
    let pitchHz = 220;

    function buildAudio(c) {
      ctx = c;
      ({ master } = createMasterBus(c, 0.45));
      osc = ctx.createOscillator();
      osc.type = "sawtooth";
      osc.frequency.value = pitchHz;
      toneGain = ctx.createGain();
      toneGain.gain.value = 0;
      osc.connect(toneGain);
      toneGain.connect(master);
      osc.start();
      const len = ctx.sampleRate * 2;
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      noise = ctx.createBufferSource();
      noise.buffer = buf;
      noise.loop = true;
      noiseGain = ctx.createGain();
      noiseGain.gain.value = 0;
      noise.connect(noiseGain);
      noiseGain.connect(master);
      noise.start();
      built = true;
      tick();
    }

    async function initSensors() {
      if (sensorsReady) return;
      const ok = await enableSensors(SENSOR_OPTS);
      if (!ok) return;
      onMotion(({ x, y, z }) => {
        if (!holding || !built) return;
        const dx = x - lastAccel.x;
        const dy = y - lastAccel.y;
        const dz = z - lastAccel.z;
        lastAccel = { x, y, z };
        const jerk = Math.sqrt(dx * dx + dy * dy + dz * dz);
        const spike = Math.min(1, jerk / 3.2);
        bowEnergy = Math.min(1, bowEnergy * 0.75 + spike * 0.25);
      });
      sensorsReady = true;
    }

    function applyBow() {
      if (!built || !ctx) return;
      const e = bowEnergy;
      const t = ctx.currentTime;
      toneGain.gain.setTargetAtTime(holding ? e * 0.24 : 0, t, 0.03);
      noiseGain.gain.setTargetAtTime(holding ? e * 0.3 : 0, t, 0.03);
      osc.frequency.setTargetAtTime(pitchHz, t, 0.04);
      document.getElementById("bOut").textContent = e.toFixed(2);
      document.getElementById("bowMeter").style.width = `${e * 100}%`;
      document.getElementById("bowMeter").classList.toggle("blowing", e > 0.06);
      document.getElementById("pOut").textContent = pitchHz.toFixed(0);
    }

    function tick() {
      if (!built) return;
      if (holding) {
        bowEnergy *= 0.9;
        if (bowEnergy < 0.004) bowEnergy = 0;
      }
      applyBow();
      requestAnimationFrame(tick);
    }

    function setPitchFromTouch(ev) {
      const r = pad.getBoundingClientRect();
      const ny = 1 - Math.max(0, Math.min(1, (ev.clientY - r.top) / r.height));
      pitchHz = 110 * Math.pow(2, ny * 2);
      dot.style.left = "50%";
      dot.style.top = `${(1 - ny) * 100}%`;
      dot.style.opacity = "1";
      if (built) applyBow();
    }

    async function armBow(e) {
      primeSensors(SENSOR_OPTS);
      await startAudio(!built ? buildAudio : undefined);
      await initSensors();
      holding = true;
      activePointer = e.pointerId;
      pad.setPointerCapture(e.pointerId);
      pad.classList.add("active");
      lastAccel = { x: 0, y: 0, z: 0 };
      bowEnergy = 0;
      setPitchFromTouch(e);
    }

    pad.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      void armBow(e);
    });

    pad.addEventListener("pointermove", (e) => {
      if (e.pointerId !== activePointer) return;
      setPitchFromTouch(e);
    });

    const stop = (e) => {
      if (e.pointerId !== activePointer) return;
      holding = false;
      activePointer = null;
      bowEnergy = 0;
      pad.classList.remove("active");
      dot.style.opacity = "0";
      if (built && ctx) {
        const t = ctx.currentTime;
        toneGain.gain.setTargetAtTime(0, t, 0.06);
        noiseGain.gain.setTargetAtTime(0, t, 0.06);
        applyBow();
      }
    };

    pad.addEventListener("pointerup", stop);
    pad.addEventListener("pointercancel", stop);
    pad.addEventListener("lostpointercapture", stop);
  </script>
</body>
</html>
