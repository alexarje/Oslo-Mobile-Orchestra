<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f14" />
  <title>Delay Maze — OMO</title>
  <link rel="stylesheet" href="../../shared/ui.css" />
</head>
<body class="app-shell feedback-matrix-app">
  <header class="app-header">
    <a class="back-link" href="../../">←</a>
    <h1>Delay Maze</h1>
  </header>
  <div class="learn-panel panel" id="learnPanel">
    <h2>Feedback matrix</h2>
    <p>Turn <strong>Audio on</strong>, allow <strong>motion</strong> on iPhone. <strong>Hold</strong> the pad to feed noise into a web of delay lines. <strong>Spin</strong> the phone — gyro readout should move and the feedback routes change.</p>
  </div>
  <p class="status-bar" id="status">Turn Audio on · hold pad</p>
  <div class="readout-row">
    <p class="value-chip">Gyro <strong id="gyroOut">—</strong> °/s</p>
  </div>
  <div class="main-stage">
    <div id="pad" class="stage-fill play-grid"></div>
  </div>
  <script type="module">
    import { bindLearn, registerAudioBoot, setStatus, startAudio } from "../../shared/app.js";
    import { createMasterBus } from "../../shared/audio.js";
    import { createFeedbackMatrix } from "../../shared/feedback-matrix.js";
    import { enableSensors, onMotion, primeSensors } from "../../shared/sensors.js";

    bindLearn();
    const pad = document.getElementById("pad");
    const gyroOut = document.getElementById("gyroOut");
    const SENSOR_OPTS = { needMotion: true, needOrientation: false };

    let ctx, master, matrix, noise, noiseGain, built = false;
    let sensorsReady = false;
    let holding = false;
    let activeId = null;
    let pingTimer = null;
    let lastGyro = 0;

    function applyGyro(rotAlpha, rotBeta, rotGamma) {
      const a = rotAlpha ?? 0;
      const b = rotBeta ?? 0;
      const g = rotGamma ?? 0;
      const mag = Math.sqrt(a * a + b * b + g * g);
      if (Number.isFinite(mag)) lastGyro = mag;
      gyroOut.textContent = lastGyro > 0.05 ? lastGyro.toFixed(1) : "0";
      if (matrix && ctx) {
        matrix.setRouting({ alpha: a, beta: b, gamma: g });
      }
    }

    function buildAudio(c) {
      ctx = c;
      ({ master } = createMasterBus(c, 0.52));
      matrix = createFeedbackMatrix(ctx, master);
      const len = ctx.sampleRate * 0.15;
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      noise = ctx.createBufferSource();
      noise.buffer = buf;
      noise.loop = true;
      noiseGain = ctx.createGain();
      noiseGain.gain.value = 0;
      noise.connect(noiseGain);
      noiseGain.connect(matrix.input);
      noise.start();
      built = true;
    }

    async function initSensors() {
      if (sensorsReady) return true;
      const ok = await enableSensors(SENSOR_OPTS);
      if (!ok) {
        setStatus("status", "Allow motion in Settings — delays still play", "warn");
        gyroOut.textContent = "off";
        return false;
      }
      onMotion((data) => {
        applyGyro(data.rotAlpha, data.rotBeta, data.rotGamma);
      });
      sensorsReady = true;
      setStatus("status", "Motion on · hold pad to play", "ok");
      return true;
    }

    function excite() {
      if (!matrix || !ctx) return;
      matrix.ping(0.5, ctx.currentTime);
      noiseGain.gain.setTargetAtTime(0.14, ctx.currentTime, 0.02);
    }

    registerAudioBoot(async (c) => {
      buildAudio(c);
      primeSensors(SENSOR_OPTS);
      await initSensors();
    });

    pad.addEventListener("pointerdown", async (e) => {
      e.preventDefault();
      primeSensors(SENSOR_OPTS);
      await startAudio(async (c) => {
        if (!built) buildAudio(c);
        await initSensors();
      });
      if (!built) return;
      holding = true;
      activeId = e.pointerId;
      pad.setPointerCapture(activeId);
      pad.classList.add("active");
      excite();
      pingTimer = setInterval(excite, 300);
    });

    const stop = (e) => {
      if (e && e.pointerId !== activeId) return;
      holding = false;
      activeId = null;
      pad.classList.remove("active");
      clearInterval(pingTimer);
      pingTimer = null;
      if (ctx && noiseGain) noiseGain.gain.setTargetAtTime(0, ctx.currentTime, 0.1);
    };
    pad.addEventListener("pointerup", stop);
    pad.addEventListener("pointercancel", stop);
    pad.addEventListener("lostpointercapture", stop);
  </script>
</body>
</html>
