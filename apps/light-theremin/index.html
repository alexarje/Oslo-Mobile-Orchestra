<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f14" />
  <title>Shadow Tone — OMO</title>
  <link rel="stylesheet" href="../../shared/ui.css" />
</head>
<body class="app-shell light-theremin-app">
  <header class="app-header">
    <a class="back-link" href="../../">←</a>
    <h1>Shadow Tone</h1>
  </header>
  <div class="learn-panel panel" id="learnPanel">
    <h2>Ambient light → pitch</h2>
    <p>Turn <strong>Audio on</strong>, then <strong>hold</strong> the pad. Cover the front light sensor or move into shadow for a lower tone; bright light raises pitch.</p>
    <p>No light sensor? Use the <strong>Light</strong> slider or drag <strong>up/down</strong> on the pad while holding.</p>
  </div>
  <div class="breath-row light-row">
    <label for="lightSim">Light</label>
    <input type="range" id="lightSim" min="0" max="100" value="55" />
    <span class="light-lux" id="luxOut">—</span>
  </div>
  <div class="readout-row">
    <p class="value-chip">Pitch <strong id="hzOut">220</strong> Hz</p>
    <p class="value-chip">Source <strong id="srcOut">slider</strong></p>
  </div>
  <div class="main-stage">
    <div id="pad" class="stage-fill play-grid light-pad">
      <div class="light-glow" id="glow"></div>
    </div>
  </div>
  <script type="module">
    import { bindLearn, startAudio } from "../../shared/app.js";
    import { createMasterBus } from "../../shared/audio.js";

    bindLearn();
    const pad = document.getElementById("pad");
    const glow = document.getElementById("glow");
    const lightSim = document.getElementById("lightSim");
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

    let ctx, master, osc, amp, filter;
    let built = false;
    let holding = false;
    let activeId = null;
    let lux = 0.55;
    let sensorLabel = "slider";
    let lightSensor = null;
    let manualNorm = 0.55;
    let raf = 0;

    function normFromLux(l) {
      if (!Number.isFinite(l) || l <= 0) return manualNorm;
      return clamp(1 - Math.log10(clamp(l, 1, 10000)) / 4, 0, 1);
    }

    function hzFromNorm(n) {
      return 110 * Math.pow(880 / 110, clamp(n, 0, 1));
    }

    function readLight() {
      if (lightSensor && Number.isFinite(lightSensor.illuminance)) {
        lux = lightSensor.illuminance;
        sensorLabel = "sensor";
        return normFromLux(lux);
      }
      sensorLabel = "slider";
      return manualNorm;
    }

    function applyLight() {
      const n = readLight();
      const hz = hzFromNorm(n);
      document.getElementById("hzOut").textContent = hz.toFixed(0);
      document.getElementById("luxOut").textContent =
        sensorLabel === "sensor" ? `${lux.toFixed(0)} lx` : `${(n * 100) | 0}%`;
      document.getElementById("srcOut").textContent = sensorLabel;
      glow.style.opacity = String(0.15 + (1 - n) * 0.65);
      if (!ctx || !osc) return;
      const t = ctx.currentTime;
      osc.frequency.setTargetAtTime(hz, t, 0.04);
      filter.frequency.setTargetAtTime(400 + (1 - n) * 4200, t, 0.05);
      if (holding) {
        amp.gain.setTargetAtTime(0.22 + (1 - n) * 0.12, t, 0.03);
      }
    }

    function buildVoice(c) {
      ctx = c;
      ({ master } = createMasterBus(c, 0.52));
      osc = ctx.createOscillator();
      amp = ctx.createGain();
      filter = ctx.createBiquadFilter();
      osc.type = "sine";
      osc.frequency.value = 220;
      filter.type = "lowpass";
      filter.frequency.value = 2400;
      filter.Q.value = 0.9;
      amp.gain.value = 0;
      osc.connect(filter);
      filter.connect(amp);
      amp.connect(master);
      osc.start();
      built = true;
      tryStartLightSensor();
      tick();
    }

    async function tryStartLightSensor() {
      if (!("AmbientLightSensor" in window)) return;
      try {
        if (typeof AmbientLightSensor.requestPermission === "function") {
          const r = await AmbientLightSensor.requestPermission();
          if (r !== "granted") return;
        }
        lightSensor = new AmbientLightSensor();
        lightSensor.addEventListener("reading", applyLight);
        lightSensor.addEventListener("error", () => {
          lightSensor = null;
        });
        lightSensor.start();
      } catch {
        lightSensor = null;
      }
    }

    function tick() {
      applyLight();
      raf = requestAnimationFrame(tick);
    }

    lightSim.addEventListener("input", (e) => {
      manualNorm = +e.target.value / 100;
      applyLight();
    });

    pad.addEventListener("pointerdown", async (ev) => {
      ev.preventDefault();
      await startAudio(!built ? buildVoice : undefined);
      if (!built) return;
      activeId = ev.pointerId;
      pad.setPointerCapture(activeId);
      pad.classList.add("active");
      holding = true;
      const r = pad.getBoundingClientRect();
      manualNorm = clamp(1 - (ev.clientY - r.top) / r.height, 0, 1);
      lightSim.value = String((manualNorm * 100) | 0);
      amp.gain.setTargetAtTime(0.28, ctx.currentTime, 0.02);
      applyLight();
    });

    pad.addEventListener("pointermove", (ev) => {
      if (ev.pointerId !== activeId || lightSensor) return;
      const r = pad.getBoundingClientRect();
      manualNorm = clamp(1 - (ev.clientY - r.top) / r.height, 0, 1);
      lightSim.value = String((manualNorm * 100) | 0);
      applyLight();
    });

    const stop = (ev) => {
      if (ev.pointerId !== activeId) return;
      activeId = null;
      holding = false;
      pad.classList.remove("active");
      amp.gain.setTargetAtTime(0, ctx.currentTime, 0.05);
    };
    pad.addEventListener("pointerup", stop);
    pad.addEventListener("pointercancel", stop);
    pad.addEventListener("lostpointercapture", stop);

    window.addEventListener("pagehide", () => {
      cancelAnimationFrame(raf);
      try {
        lightSensor?.stop();
      } catch {
        /* noop */
      }
    });
  </script>
</body>
</html>
