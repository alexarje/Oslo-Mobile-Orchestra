<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f14" />
  <title>Mic Theremin — OMO</title>
  <link rel="stylesheet" href="../../shared/ui.css" />
</head>
<body class="app-shell">
  <header class="app-header">
    <a class="back-link" href="../../">←</a>
    <h1>Mic Theremin</h1>
  </header>
  <div class="learn-panel panel" id="learnPanel">
    <h2>Mic → pitch</h2>
    <p>Tap <strong>Audio on</strong> (or the pad) and allow the mic. Hum or sing — pitch drives the tone. <strong>Hold the pad</strong> to hear it; slide <strong>up/down</strong> for volume.</p>
    <p>If the <strong>Mic</strong> bar stays empty, check browser mic permission for this site.</p>
  </div>
  <p class="status-bar" id="status">Tap Audio on or the pad to start</p>
  <div class="breath-row">
    <label>Mic</label>
    <div class="breath-meter" id="micMeterWrap">
      <div class="breath-meter-fill" id="micMeter"></div>
    </div>
  </div>
  <div class="readout-row">
    <p class="value-chip">Pitch <strong id="hzOut">—</strong></p>
    <p class="value-chip">Note <strong id="noteOut">—</strong></p>
  </div>
  <div class="main-stage">
    <div id="pad" class="stage-fill play-grid"><div class="touch-dot" id="dot"></div></div>
  </div>
  <script type="module">
    import { bindLearn, setStatus, createAudioBoot, registerAudioBoot } from "../../shared/app.js";
    import { createMasterBus, connectMicAnalyser, getMicStream, primeMicStream } from "../../shared/audio.js";
    import { detectPitchHz, hzToMidi } from "../../shared/pitch.js";

    bindLearn();
    const pad = document.getElementById("pad");
    const dot = document.getElementById("dot");
    let ctx, master, osc, amp, analyser, micStream, buf;
    let built = false;
    let holding = false;
    let lastHz = null;

    const names = ["C", "C♯", "D", "D♯", "E", "F", "F♯", "G", "G♯", "A", "A♯", "B"];

    function getRms() {
      if (!analyser) return 0;
      analyser.getFloatTimeDomainData(buf);
      let s = 0;
      for (let i = 0; i < buf.length; i++) s += buf[i] ** 2;
      return Math.sqrt(s / buf.length);
    }

    function micTrackLive() {
      const track = micStream?.getAudioTracks?.()[0];
      return track && track.readyState === "live" && !track.muted;
    }

    async function build(c) {
      if (built && micTrackLive()) {
        tick();
        return;
      }
      if (built) {
        micStream?.getTracks?.().forEach((t) => t.stop());
        micStream = null;
        built = false;
      }
      if (!navigator.mediaDevices?.getUserMedia) {
        setStatus("status", "Mic not supported", "warn");
        throw new Error("no mic");
      }
      ctx = c;
      ({ master } = createMasterBus(c, 0.45));
      osc = ctx.createOscillator();
      amp = ctx.createGain();
      amp.gain.value = 0;
      osc.type = "sine";
      osc.connect(amp);
      amp.connect(master);
      osc.start();
      analyser = ctx.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0.2;
      buf = new Float32Array(analyser.fftSize);
      try {
        micStream = await getMicStream();
      } catch {
        setStatus("status", "Mic denied — allow in Settings", "warn");
        throw new Error("denied");
      }
      connectMicAnalyser(ctx, micStream, analyser, { inputGain: 2.5 });
      built = true;
      setStatus("status", "Mic live — hold pad to play", "ok");
      tick();
    }

    function tick() {
      if (!built) return;
      const rms = getRms();
      const pct = Math.min(100, (rms / 0.08) * 100);
      document.getElementById("micMeter").style.width = `${pct}%`;
      document.getElementById("micMeter").classList.toggle("blowing", rms > 0.004);

      const hz = rms > 0.003 ? detectPitchHz(buf, ctx.sampleRate) : null;
      if (hz) {
        lastHz = lastHz ? lastHz * 0.35 + hz * 0.65 : hz;
        const t = ctx.currentTime;
        osc.frequency.setTargetAtTime(lastHz, t, 0.05);
        document.getElementById("hzOut").textContent = lastHz.toFixed(0);
        const m = Math.round(hzToMidi(lastHz));
        document.getElementById("noteOut").textContent = `${names[((m % 12) + 12) % 12]}${Math.floor(m / 12) - 1}`;
      } else if (rms <= 0.003) {
        document.getElementById("hzOut").textContent = "—";
        document.getElementById("noteOut").textContent = "—";
      }

      requestAnimationFrame(tick);
    }

    const ensureAudio = createAudioBoot(build, { screenTap: true, mic: true });
    registerAudioBoot(build, { mic: true });

    function setVolumeFromY(clientY) {
      const r = pad.getBoundingClientRect();
      const ny = 1 - Math.max(0, Math.min(1, (clientY - r.top) / r.height));
      dot.style.left = "50%";
      dot.style.top = `${(1 - ny) * 100}%`;
      dot.style.opacity = "1";
      const vol = 0.08 + ny * 0.42;
      amp.gain.setTargetAtTime(vol, ctx.currentTime, 0.02);
    }

    pad.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      primeMicStream();
      void ensureAudio().then(() => {
        if (!built) return;
        holding = true;
        pad.setPointerCapture(e.pointerId);
        pad.classList.add("active");
        setVolumeFromY(e.clientY);
      });
    });

    pad.addEventListener("pointermove", (e) => {
      if (!holding) return;
      setVolumeFromY(e.clientY);
    });

    const stop = () => {
      if (!holding) return;
      holding = false;
      if (amp && ctx) amp.gain.setTargetAtTime(0, ctx.currentTime, 0.05);
      pad.classList.remove("active");
      dot.style.opacity = "0";
    };
    pad.addEventListener("pointerup", stop);
    pad.addEventListener("pointercancel", stop);
  </script>
</body>
</html>
