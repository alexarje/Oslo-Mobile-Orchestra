<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f14" />
  <title>Mic Theremin — OMO</title>
  <link rel="stylesheet" href="../../shared/ui.css" />
</head>
<body class="app-shell">
  <header class="app-header">
    <a class="back-link" href="../../">←</a>
    <h1>Mic Theremin</h1>
  </header>
  <div class="learn-panel panel" id="learnPanel">
    <h2>Mic → pitch</h2>
    <p>Turn <strong>Audio on</strong>, then Hum or sing into the mic; pitch is tracked and drives a sine tone. Slide vertically for volume.</p>
  </div>
  <p class="status-bar" id="status"></p>
  <div class="readout-row">
    <p class="value-chip">Pitch <strong id="hzOut">—</strong></p>
    <p class="value-chip">Note <strong id="noteOut">—</strong></p>
  </div>
  <div class="main-stage">
    <div id="pad" class="stage-fill play-grid"><div class="touch-dot" id="dot"></div></div>
  </div>
  <script type="module">
    import { bindLearn, setStatus, startAudio } from "../../shared/app.js";
    import { createMasterBus } from "../../shared/audio.js";
    import { detectPitchHz, hzToMidi } from "../../shared/pitch.js";

    bindLearn();
    const pad = document.getElementById("pad");
    let ctx, master, osc, amp, analyser, mic, buf;
    let built = false;
    let active = false;
    let raf = 0;

    const names = ["C", "C♯", "D", "D♯", "E", "F", "F♯", "G", "G♯", "A", "A♯", "B"];

    async function build(c) {
      ctx = c;
      ({ master } = createMasterBus(c, 0.45));
      osc = ctx.createOscillator();
      amp = ctx.createGain();
      amp.gain.value = 0;
      osc.type = "sine";
      osc.connect(amp);
      amp.connect(master);
      osc.start();
      analyser = ctx.createAnalyser();
      analyser.fftSize = 2048;
      buf = new Float32Array(analyser.fftSize);
      try {
        mic = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false },
          video: false,
        });
      } catch {
        setStatus("status", "Mic denied", "warn");
        return;
      }
      ctx.createMediaStreamSource(mic).connect(analyser);
      built = true;
    }

    function tick() {
      if (!built || !active) return;
      analyser.getFloatTimeDomainData(buf);
      const hz = detectPitchHz(buf, ctx.sampleRate);
      const t = ctx.currentTime;
      if (hz) {
        osc.frequency.setTargetAtTime(hz, t, 0.04);
        document.getElementById("hzOut").textContent = hz.toFixed(0);
        const m = Math.round(hzToMidi(hz));
        document.getElementById("noteOut").textContent = `${names[((m % 12) + 12) % 12]}${Math.floor(m / 12) - 1}`;
      }
      raf = requestAnimationFrame(tick);
    }

    pad.addEventListener("pointerdown", async (e) => {
      e.preventDefault();
      await startAudio(!built ? build : undefined);
      if (!built) return;
      active = true;
      pad.setPointerCapture(e.pointerId);
      pad.classList.add("active");
      amp.gain.setTargetAtTime(0.35, ctx.currentTime, 0.02);
      tick();
    });

    const stop = (e) => {
      if (!active) return;
      active = false;
      cancelAnimationFrame(raf);
      amp.gain.setTargetAtTime(0, ctx.currentTime, 0.05);
      pad.classList.remove("active");
    };
    pad.addEventListener("pointerup", stop);
    pad.addEventListener("pointercancel", stop);
  </script>
</body>
</html>
