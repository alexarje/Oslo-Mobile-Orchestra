# Publishes the site to the gh-pages branch. Enable Pages once:
# Settings → Pages → Deploy from a branch → gh-pages / (root)
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4.7.2
        with:
          folder: .
          branch: gh-pages
          clean: true
          single-commit: true
          exclude_assets: |
            .github
